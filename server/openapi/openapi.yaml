openapi: "3.1.0"
info:
  title: Spraywall API
  version: "0.1.0"
  description: |
    API for the Spraywall climbing app.

    Authorization: instance admins (`users.role = admin`, e.g. members of `OIDC_ADMIN_GROUP`)
    are treated as gym admins in every gym, whether or not they have a membership row.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: ok
                required: [status, db]
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: degraded
                  db:
                    type: string
                    example: error
                required: [status, db]

  /auth/register:
    post:
      operationId: register
      summary: Register a new user
      description: Returns 403 when password login is disabled (`PASSWORD_LOGIN_ENABLED=false`).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/PasswordLoginDisabled"
        "409":
          description: Email already taken

  /auth/login:
    post:
      operationId: login
      summary: Log in
      description: Returns 403 when password login is disabled (`PASSWORD_LOGIN_ENABLED=false`).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials
        "403":
          $ref: "#/components/responses/PasswordLoginDisabled"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/config:
    get:
      operationId: getAuthConfig
      summary: Get available login methods
      tags: [Auth]
      responses:
        "200":
          description: Enabled login methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/oidc/login:
    get:
      operationId: oidcLogin
      summary: Start OIDC login
      description: |
        Stores state, nonce, PKCE verifier and the redirect path in a short-lived signed cookie
        and redirects the browser to the identity provider.
      tags: [Auth]
      parameters:
        - name: redirect
          in: query
          required: false
          description: Path to return to after login. Must start with `/` (not `//`); otherwise ignored.
          schema:
            type: string
            example: /invite/abc123
      responses:
        "302":
          description: Redirect to the identity provider's authorization endpoint
        "404":
          description: OIDC is not configured

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC redirect target
      description: |
        Validates the state cookie, exchanges the code (with PKCE) and verifies the ID token.

        Login mode:
          - success: 302 to `/auth/callback#access_token=...&refresh_token=...&redirect=...`
          - failure: 302 to `/login?error=<code>`

        Link mode (started via `POST /auth/oidc/link`):
          - success: 302 to `/profile?linked=1`
          - failure: 302 to `/profile?error=<code>`

        Error codes: `oidc_failed`, `state_invalid`, `email_missing`, `email_unverified`,
        `identity_in_use`, `access_denied`.

        An unknown identity is linked to an existing account with the same email only when the
        provider reports the email as verified (otherwise `email_unverified`); if no account has
        that email, a new one is created. When `OIDC_ADMIN_GROUP` is set, the user's role is set
        to `admin` or `climber` from the groups claim on every login.
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error returned by the identity provider (e.g. `access_denied`)
          schema:
            type: string
      responses:
        "302":
          description: Redirect back into the web app (see description)

  /auth/oidc/link:
    post:
      operationId: oidcLink
      summary: Start linking the OIDC provider to the current account
      description: |
        Sets the link-mode state cookie and returns the authorization URL. The client navigates
        to `url`; the callback then attaches the identity to the current user.
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                required: [url]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: OIDC is not configured

  /auth/me:
    get:
      operationId: getMe
      summary: Get current user profile
      tags: [User]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me:
    patch:
      operationId: updateMe
      summary: Update current user profile
      tags: [User]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/password:
    put:
      operationId: changePassword
      summary: Set or change password
      description: |
        `current_password` is required when the user already has a password; users without one
        (SSO-only accounts) may set one directly. All other refresh tokens are revoked and a new
        token pair is returned.
      tags: [User]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: New password too short, or current password missing/incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/PasswordLoginDisabled"

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      summary: Upload a profile picture
      description: Max 5 MB; JPEG, PNG, WebP or GIF. Takes precedence over the provider's `picture`.
      tags: [User]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
              required: [avatar]
            encoding:
              avatar:
                contentType: image/jpeg, image/png, image/webp, image/gif
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAvatar
      summary: Remove the profile picture
      tags: [User]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      summary: Unlink an SSO identity
      tags: [User]
      security:
        - BearerAuth: []
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Unlinking would leave the account without a login method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /gyms:
    get:
      operationId: listGyms
      summary: List gyms the user belongs to
      tags: [Gym]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of gyms
          content:
            application/json:
              schema:
                type: object
                properties:
                  gyms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gym"
                required: [gyms]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createGym
      summary: Create a gym
      tags: [Gym]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGymRequest"
      responses:
        "201":
          description: Gym created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /gyms/{gymSlug}/walls/{wallId}/circuits:
    get:
      operationId: listCircuits
      summary: List visible circuits on a wall
      description: >-
        Returns the caller's circuits first, ordered by name, then shared circuits from other members,
        also ordered by name. Each route_ids list includes published routes and only drafts visible to
        the caller.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      responses:
        "200":
          description: Visible circuits
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Circuit"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createCircuit
      summary: Create a circuit
      description: >-
        Names are trimmed and must contain 1–60 characters. Every route must belong to this wall and
        be published or a draft created by the caller. A circuit can contain at most 100 unique routes.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 60}
                color: {type: string, enum: [violet, orange, green, blue, pink, teal, amber, red, slate, ink], default: violet}
                emoji: {type: string, enum: [🔥, 💪, 🎯, ⭐, 🧗, 🪨, 🏆, ⚡, 🧠, 🦶, 🌀, 🐢], default: "🧗"}
                is_shared: {type: boolean, default: false}
                route_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        "201":
          description: Circuit created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Circuit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /gyms/{gymSlug}/walls/{wallId}/circuits/{circuitId}:
    get:
      operationId: getCircuit
      summary: Get a visible circuit
      description: The owner can read private circuits; any gym member can read a shared circuit. Other private circuits return 404.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Circuit, content: {application/json: {schema: {$ref: "#/components/schemas/Circuit"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateCircuit
      summary: Update an owned circuit
      description: Only the circuit owner may edit it. Names are trimmed and limited to 1–60 characters; color and emoji must use the supported presets.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 60}
                color: {type: string, enum: [violet, orange, green, blue, pink, teal, amber, red, slate, ink]}
                emoji: {type: string, enum: [🔥, 💪, 🎯, ⭐, 🧗, 🪨, 🏆, ⚡, 🧠, 🦶, 🌀, 🐢]}
                is_shared: {type: boolean}
      responses:
        "200":
          description: Updated circuit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Circuit"}
        "403": {description: Not owner}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteCircuit
      summary: Delete a visible circuit as its owner or a gym admin
      description: Private circuits are hidden from non-owners, including gym admins. Gym admins may delete shared circuits visible to them.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Circuit deleted}
        "403": {description: Not owner or gym admin of a visible circuit}
        "404": {$ref: "#/components/responses/NotFound"}
  /gyms/{gymSlug}/walls/{wallId}/circuits/{circuitId}/routes:
    put:
      operationId: replaceCircuitRoutes
      summary: Atomically replace ordered circuit routes
      description: Only the owner may replace the visible route order. The list has at most 100 unique routes, all on this wall and published or caller-owned drafts; routes hidden from the caller are preserved in their prior relative position.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_ids]
              properties:
                route_ids: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Updated circuit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Circuit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {description: Not owner}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: appendCircuitRoute
      summary: Append a route idempotently
      description: Only the owner may append. Repeating an existing route_id is a no-op; the circuit limit is 100 routes, including routes hidden from the caller.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id]
              properties: {route_id: {type: string, format: uuid}}
      responses:
        "200":
          description: Updated circuit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Circuit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {description: Not owner}
  /gyms/{gymSlug}/walls/{wallId}/circuits/{circuitId}/routes/{routeId}:
    delete:
      operationId: removeCircuitRoute
      summary: Remove a route from the circuit
      description: Only the owner may remove a route; this returns 204 whether or not the route was present.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - {name: circuitId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: routeId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Route removed}
        "403": {description: Not owner}
        "404": {$ref: "#/components/responses/NotFound"}

  /gyms/{gymSlug}:
    get:
      operationId: getGym
      summary: Get gym by slug
      tags: [Gym]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
      responses:
        "200":
          description: Gym detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /gyms/{gymSlug}/walls:
    get:
      operationId: listWalls
      summary: List walls in a gym
      tags: [Wall]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
      responses:
        "200":
          description: List of walls
          content:
            application/json:
              schema:
                type: object
                properties:
                  walls:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wall"
                required: [walls]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWall
      summary: Create a wall
      tags: [Wall]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateWallRequest"
      responses:
        "201":
          description: Wall created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wall"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /gyms/{gymSlug}/walls/{wallId}:
    get:
      operationId: getWall
      summary: Get wall by ID
      tags: [Wall]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      responses:
        "200":
          description: Wall detail with image and detection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WallDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /gyms/{gymSlug}/walls/{wallId}/images:
    post:
      operationId: uploadWallImage
      summary: Upload a wall image (full reset by default; partial reset with mode=partial)
      tags: [Wall]
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
                mode: {type: string, enum: [full, partial], description: Omit or use full for a full reset}
      responses:
        "201": {description: Image and detection job created}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Partial reset requires an active image}

  /gyms/{gymSlug}/walls/{wallId}/resets/{imageId}:
    parameters:
      - $ref: "#/components/parameters/gymSlug"
      - $ref: "#/components/parameters/wallId"
      - name: imageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getWallReset
      summary: Get a pending reset diff (setters and admins only)
      tags: [Wall]
      security: [{BearerAuth: []}]
      responses:
        "200":
          description: Pending reset diff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WallResetDiff"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: discardWallReset
      summary: Discard a pending reset
      tags: [Wall]
      security: [{BearerAuth: []}]
      responses:
        "204": {description: Pending reset discarded}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /gyms/{gymSlug}/walls/{wallId}/resets/{imageId}/matches:
    parameters:
      - $ref: "#/components/parameters/gymSlug"
      - $ref: "#/components/parameters/wallId"
      - name: imageId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateWallResetMatch
      summary: Replace a hold match (null new_hold_id removes it)
      tags: [Wall]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_hold_id]
              properties:
                old_hold_id: {type: string, format: uuid}
                new_hold_id: {type: string, format: uuid, nullable: true}
      responses:
        "200": {description: Match updated}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /gyms/{gymSlug}/walls/{wallId}/resets/{imageId}/holds/{holdId}:
    parameters:
      - $ref: "#/components/parameters/gymSlug"
      - $ref: "#/components/parameters/wallId"
      - name: imageId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: holdId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteWallResetHold
      summary: Delete a detected hold from a pending reset
      tags: [Wall]
      security: [{BearerAuth: []}]
      responses:
        "204": {description: Hold deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /gyms/{gymSlug}/walls/{wallId}/resets/{imageId}/restore:
    post:
      operationId: restoreWallResetHold
      summary: Restore an old hold into a pending reset
      tags: [Wall]
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - name: imageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_hold_id]
              properties:
                old_hold_id: {type: string, format: uuid}
      responses:
        "201": {description: Hold restored and matched}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /gyms/{gymSlug}/walls/{wallId}/resets/{imageId}/apply:
    post:
      operationId: applyWallReset
      summary: Apply a completed pending reset
      tags: [Wall]
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - name: imageId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Reset applied, with kept and archived route counts}
        "409": {description: Pending reset is stale or detection is incomplete}
        "403": {$ref: "#/components/responses/Forbidden"}

  /gyms/{gymSlug}/walls/{wallId}/routes:
    get:
      operationId: listRoutes
      summary: List routes on a wall
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoute
      summary: Create a route
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Route created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /gyms/{gymSlug}/walls/{wallId}/routes/{routeId}:
    get:
      operationId: getRoute
      summary: Get route by ID
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      responses:
        "200":
          description: Route detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRoute
      summary: Update route metadata
      description: Only the route creator can edit. Omitted or null tags preserve existing tags; an explicit empty array clears them.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteRequest"
      responses:
        "200":
          description: Route updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the route creator can edit
        "404":
          $ref: "#/components/responses/NotFound"

  /gyms/{gymSlug}/walls/{wallId}/activity:
    get:
      operationId: listWallActivity
      summary: List activity across climbs on a wall
      description: Returns published climb activity from all gym members, including notes, newest climbing date first. Draft activity is visible only to its author.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size (default 20, maximum 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a member of the gym
        "404":
          $ref: "#/components/responses/NotFound"

  /gyms/{gymSlug}/walls/{wallId}/routes/{routeId}/activity:
    get:
      operationId: listRouteActivity
      summary: List activity for a climb
      description: Returns all gym members' activity and notes for this climb. Draft activity is visible only to its author.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size (default 20, maximum 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not a member of the gym
        "404":
          $ref: "#/components/responses/NotFound"

  /gyms/{gymSlug}/walls/{wallId}/routes/{routeId}/logs:
    get:
      operationId: listClimbLogs
      summary: List the current user's history for a climb
      description: Returns only the authenticated member's entries. The activity feed is a separate gym-visible view that includes notes.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      responses:
        "200":
          description: Entries ordered by climbing date and logging timestamp (empty array when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClimbLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createClimbLog
      summary: Add a climb activity
      description: New logs are unavailable for drafts and reset climbs. Flash must be first in chronological history.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClimbLogRequest"
      responses:
        "201":
          description: Activity logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimbLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Activity would precede a recorded Flash
        "401":
          $ref: "#/components/responses/Unauthorized"
  /gyms/{gymSlug}/walls/{wallId}/routes/{routeId}/logs/{logId}:
    put:
      operationId: updateClimbLog
      summary: Correct an owned climb entry
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
        - name: logId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClimbLogRequest"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClimbLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Entry is owned by another user
        "409":
          description: Updated chronology conflicts with Flash
    delete:
      operationId: deleteClimbLog
      summary: Delete one owned climb entry
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
        - name: logId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Entry deleted }
        "403": { description: Entry is owned by another user }
        "404": { $ref: "#/components/responses/NotFound" }
  /gyms/{gymSlug}/walls/{wallId}/routes/{routeId}/rating:
    put:
      operationId: setRouteRating
      summary: Set or update the current user's community rating
      description: One editable vote per user and published route; logging activity is not required.
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
              required: [stars]
      responses:
        "200": { description: Rating saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: removeRouteRating
      summary: Remove the current user's rating
      tags: [Route]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
        - $ref: "#/components/parameters/wallId"
        - $ref: "#/components/parameters/routeId"
      responses:
        "204": { description: Vote removed }

  /users/me/logbook:
    get:
      operationId: getLogbook
      summary: Get all of the current user's climb activity
      description: Includes attempts, sends, flashes, notes, climbing dates, and wall/gym identifiers for detail navigation.
      tags: [User]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User logbook, newest climbing date first within each wall
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogbookEntry"

  /gyms/{gymSlug}/invites:
    post:
      operationId: createInvite
      summary: Create a gym invite
      tags: [Invite]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/gymSlug"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /invites/{code}/accept:
    post:
      operationId: acceptInvite
      summary: Accept a gym invite
      tags: [Invite]
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    gymSlug:
      name: gymSlug
      in: path
      required: true
      schema:
        type: string
    wallId:
      name: wallId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    routeId:
      name: routeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PasswordLoginDisabled:
      description: Password login is disabled (`PASSWORD_LOGIN_ENABLED=false`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Circuit:
      type: object
      required: [id, wall_id, created_by, creator_name, name, color, emoji, is_shared, is_owner, route_ids, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        wall_id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        creator_name: {type: string}
        name: {type: string, minLength: 1, maxLength: 60}
        color: {type: string, enum: [violet, orange, green, blue, pink, teal, amber, red, slate, ink]}
        emoji: {type: string, enum: [🔥, 💪, 🎯, ⭐, 🧗, 🪨, 🏆, ⚡, 🧠, 🦶, 🌀, 🐢]}
        is_shared: {type: boolean}
        is_owner: {type: boolean}
        route_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
      required: [email, password, display_name]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required: [access_token, refresh_token]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, email, display_name]

    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            role:
              type: string
              enum: [admin, setter, climber]
              description: Instance role. `admin` is treated as admin in every gym.
            avatar_url:
              type: ["string", "null"]
              example: /images/avatars/7f8e9a10-1b2c-4d3e-8f90-a1b2c3d4e5f6.jpg
            has_password:
              type: boolean
            identities:
              type: array
              items:
                $ref: "#/components/schemas/UserIdentity"
          required: [avatar_url, has_password, identities]

    UserIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          example: https://id.example.com
        provider_name:
          type: string
          example: Pocket-ID
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [id, issuer, provider_name, email, created_at]

    AuthConfig:
      type: object
      properties:
        password_enabled:
          type: boolean
        oidc:
          type: object
          properties:
            enabled:
              type: boolean
            name:
              type: string
              example: SSO
          required: [enabled, name]
      required: [password_enabled, oidc]

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
      required: [display_name]

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          description: Required when the user already has a password
        new_password:
          type: string
          minLength: 8
      required: [new_password]

    Gym:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, name, slug]

    CreateGymRequest:
      type: object
      properties:
        name:
          type: string
      required: [name]

    Wall:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, gym_id, name]

    WallResetDiff:
      type: object
      required: [new_holds, removed_holds, alignment, affected_routes, kept_route_count, detection_status]
      properties:
        new_holds:
          type: array
          items:
            type: object
            required: [id, bbox, confidence, matched_old_hold_id]
            properties:
              id: {type: string, format: uuid}
              bbox: {type: object}
              polygon: {type: array, nullable: true, items: {type: array, items: {type: number}}}
              confidence: {type: number}
              matched_old_hold_id: {type: string, format: uuid, nullable: true}
        removed_holds:
          type: array
          items:
            type: object
            required: [old_hold_id, bbox, confidence]
            properties:
              old_hold_id: {type: string, format: uuid}
              bbox: {type: object}
              polygon: {type: array, nullable: true, items: {type: array, items: {type: number}}}
              confidence: {type: number}
        alignment:
          type: object
          required: [ok, inliers]
          properties:
            ok: {type: boolean}
            inliers: {type: integer}
        affected_routes:
          type: array
          items:
            type: object
            required: [id, name, status, missing_hold_ids]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              grade: {type: string, nullable: true}
              status: {type: string}
              missing_hold_ids: {type: array, items: {type: string, format: uuid}}
        kept_route_count: {type: integer}
        detection_status: {type: string}

    WallDetail:
      type: object
      properties:
        wall:
          $ref: "#/components/schemas/Wall"
        image:
          oneOf:
            - $ref: "#/components/schemas/WallImage"
            - type: "null"
        detection_status:
          type: ["string", "null"]
        pending_reset:
          oneOf:
            - type: object
              required: [image_id, image_url, created_at]
              properties:
                image_id: {type: string, format: uuid}
                image_url: {type: string}
                detection_status: {type: string, nullable: true}
                created_at: {type: string, format: date-time}
            - type: "null"
      required: [wall]

    WallImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        wall_id:
          type: string
          format: uuid
        path:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, wall_id, path]

    CreateWallRequest:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
          format: binary
      required: [name, image]

    Route:
      type: object
      properties:
        id:
          type: string
          format: uuid
        wall_id:
          type: string
          format: uuid
        name:
          type: string
        grade:
          type: [string, "null"]
        description:
          type: [string, "null"]
        hold_ids:
          type: array
          items:
            type: string
            format: uuid
        hold_roles:
          type: object
          additionalProperties: true
        active_hold_ids:
          type: array
          description: Hold IDs translated to the active wall image for legacy routes.
          items:
            type: string
            format: uuid
        active_hold_roles:
          type: [object, "null"]
          description: Hold roles translated to the active wall image for legacy routes.
          additionalProperties: true
        status:
          type: string
          enum: [draft, published]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/RouteStyleTag"
        created_at:
          type: string
          format: date-time
        send_count:
          type: integer
          description: Total Send and Flash events, including repeats.
        has_sent:
          type: boolean
        progress:
          type: string
          enum: [not_tried, projects, sent]
        has_flashed:
          type: boolean
        rating_average:
          type: [number, "null"]
        rating_count:
          type: integer
        my_rating:
          type: [integer, "null"]
      required: [id, wall_id, name, hold_ids, tags, send_count, has_sent, progress, has_flashed, rating_average, rating_count, my_rating]

    ClimbLogRequest:
      type: object
      properties:
        outcome: { type: string, enum: [attempt, send, flash] }
        climbed_on: { type: string, format: date }
        notes: { type: [string, "null"] }
      required: [outcome, climbed_on]

    ClimbLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        outcome: { type: string, enum: [attempt, send, flash] }
        climbed_on: { type: string, format: date }
        logged_at: { type: string, format: date-time }
        notes: { type: [string, "null"] }
      required: [id, route_id, outcome, climbed_on, logged_at, notes]

    ActivityItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        route_name: { type: string }
        route_grade: { type: [string, "null"] }
        route_is_legacy: { type: boolean }
        outcome: { type: string, enum: [attempt, send, flash] }
        climbed_on: { type: string, format: date }
        logged_at: { type: string, format: date-time }
        notes: { type: [string, "null"] }
        attempts: { type: [integer, "null"] }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            avatar_url: { type: [string, "null"], format: uri-reference }
          required: [id, display_name, avatar_url]
      required: [id, route_id, route_name, route_grade, route_is_legacy, outcome, climbed_on, logged_at, notes, attempts, user]

    ActivityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        next_cursor: { type: [string, "null"] }
      required: [items, next_cursor]

    LogbookEntry:
      allOf:
        - $ref: "#/components/schemas/ClimbLog"
        - type: object
          properties:
            user_id: { type: string, format: uuid }
            sent_at: { type: string, format: date-time, deprecated: true }
            route_name: { type: string }
            route_grade: { type: [string, "null"] }
            wall_id: { type: string, format: uuid }
            wall_name: { type: string }
            gym_id: { type: string, format: uuid }
            gym_slug: { type: string }

    RouteStyleTag:
      type: string
      enum: [pumpy, crimpy, pinchy, slopey, juggy, powerful, technical, balancy, dynamic, static, reachy, compression]

    Hold:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        t:
          type: string
          description: "Hold type (start, middle, finish)"
      required: [x, y, t]

    CreateRouteRequest:
      type: object
      properties:
        name:
          type: string
        grade:
          type: [string, "null"]
        description:
          type: [string, "null"]
        hold_ids:
          type: array
          items:
            type: string
            format: uuid
        hold_roles:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, published]
        tags:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/RouteStyleTag"
          description: Omitted or null values create the route without tags.
      required: [name, hold_ids]

    UpdateRouteRequest:
      type: object
      properties:
        name:
          type: string
        grade:
          type: [string, "null"]
        description:
          type: [string, "null"]
        hold_ids:
          type: array
          items:
            type: string
            format: uuid
        hold_roles:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, published]
        tags:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/RouteStyleTag"
          description: Omitted or null preserves existing tags; an empty array clears them.
      required: [name, hold_ids]

    Invite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        code:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [id, gym_id, code]
