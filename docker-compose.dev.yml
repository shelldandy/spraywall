services:
  postgres:
    ports:
      - "5433:5432"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    build:
      target: dev
    environment:
      IMMICH_ALLOWED_HOSTS: ${IMMICH_ALLOWED_HOSTS:-}
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app

  worker:
    volumes:
      - ./worker:/app
