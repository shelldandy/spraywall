# Deploy only the standalone marketing page, not the application or repository.
[build]
  base = "."
  publish = "marketing"
  command = ""
  # Skip deploys unless the marketing page or this config changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- marketing/ netlify.toml"

[dev]
  framework = "#static"
  publish = "marketing"
